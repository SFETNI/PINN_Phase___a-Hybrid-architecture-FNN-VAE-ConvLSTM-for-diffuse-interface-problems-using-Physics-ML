name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  exact-media:
    # This is deliberately a non-skipping environment gate.  The large accepted
    # renderer inputs remain documented external assets, so this job verifies the
    # shipped all-six binding/output contract under the producer stack; the local
    # release receipt additionally records the two full external-input re-renders.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          environment-file: environment-media.yml
          activate-environment: pinn-phase-media
      - run: conda run -n pinn-phase-media python -m pytest -q tests/test_n16_96_transfer.py::test_renderer_executes_end_to_end_with_synthetic_inputs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python scripts/check_public_tree.py .
      - run: python scripts/verify_source_lineage.py
      - run: python -m pip install -r requirements/ci.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest --junitxml=pytest.xml
      - run: python scripts/check_test_outcome.py pytest.xml
      - run: python -m build --wheel
      - run: |
          python -m venv /tmp/pinn-phase-wheel
          /tmp/pinn-phase-wheel/bin/python -m pip install --upgrade pip
          /tmp/pinn-phase-wheel/bin/python -m pip install -r requirements/ci.txt
          /tmp/pinn-phase-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/pinn-phase-wheel/bin/python scripts/check_wheel_imports.py
