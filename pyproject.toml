[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-phase"
version = "0.1.0"
description = "Physics-informed neural time integrators for curvature-driven multiphase-field evolution"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Seifallah Elfetni" },
]
requires-python = ">=3.11,<3.12"
keywords = [
  "physics-informed neural networks",
  "multiphase-field",
  "microstructure evolution",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=2.2,<2.3",
  "psutil>=7.0,<8",
  "PyYAML>=6.0,<7",
  "scipy>=1.16,<1.17",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
media = ["imageio==2.37.3", "matplotlib==3.10.7", "pillow==12.2.0"]
dev = ["build>=1.2,<2", "pytest>=8.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
